<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Admin...</title>
  <script>
    // Redirect to backend Django admin
    // VITE_API_URL is injected at build time, fallback reads from localStorage or prompts
    var api = localStorage.getItem('admin_api_url') || 'http://127.0.0.1:8000';
    window.location.href = api.replace(/\/$/, '') + '/admin/';
  </script>
</head>
<body></body>
</html>
