    <!-- JSON-LD Structured Data for Google / Search Engines -->

            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "CollectionPage",
          "@id": "https://readthis.web.id/#webpage",
          "url": "https://readthis.web.id/",
          "name": "Read This - Digital Web Novel & EPUB Library",
          "isPartOf": {
